name: tests

# Checks on every push and pull request that the code still reproduces the
# numbers of the IAC-26 paper, and that every script and figure still runs.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  paper-numbers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Paper numbers, standard library only
        run: python -m unittest discover -s tests -v

      - name: Scripts, standard library only
        run: |
          python run_example.py > /dev/null
          python validate.py > /dev/null
          python fit_mers.py > /dev/null
          python make_paper_tables.py

      - name: Figures
        run: |
          python -m pip install -r requirements.txt
          python make_figures.py
