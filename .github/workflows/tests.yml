name: tests

# Checks the model and database against the IAC-26 regression values, then
# runs the maintained scripts with and without optional plotting support.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  paper-numbers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Model and database regression tests, standard library only
        run: python -m unittest discover -s tests -v

      - name: Scripts, standard library only
        run: |
          python run_example.py > /dev/null
          python validate.py > /dev/null

      - name: Example with optional plotting
        run: |
          python -m pip install -r requirements.txt
          python run_example.py > /dev/null
          test -s outputs/trade_space.png
